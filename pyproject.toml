[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "eval-ac"
dynamic = ["version"]
description = "Read the ABSCAL.HIS file of RPG microwave radiometers (e.g. HATPRO) and visualize the history of the absolute calibration with liquid nitrogen."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Andreas Foth", email = "andreas.foth@uni-leipzig.de" }]
requires-python = ">=3.9"
dependencies = [
    "numpy",
    "xarray",
    "matplotlib",
    "netCDF4",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Operating System :: OS Independent",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Atmospheric Science",
]

[project.optional-dependencies]
test = ["pytest"]
docs = ["sphinx>=7", "myst-parser>=2", "furo"]
dev = ["pytest", "flake8", "pylint", "sphinx>=7", "myst-parser>=2", "furo"]

[project.scripts]
eval-ac = "eval_ac.cli:main"

[project.urls]
Homepage = "https://github.com/WillyWallace/eval_ac"
Documentation = "https://eval-ac.readthedocs.io"
Issues = "https://github.com/WillyWallace/eval_ac/issues"

[tool.setuptools.dynamic]
version = { attr = "eval_ac.__version__" }

[tool.setuptools.packages.find]
include = ["eval_ac*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
