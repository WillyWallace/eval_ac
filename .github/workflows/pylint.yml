name: Pylint

on: [push]

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Python 3.9 is end of life and not available for Ubuntu 26.04
          # (ubuntu-latest); it is still checked on Ubuntu 24.04
          - os: ubuntu-24.04
            python-version: "3.9"
          - os: ubuntu-latest
            python-version: "3.12"
    steps:
    - uses: actions/checkout@v7
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v7
      with:
        python-version: ${{ matrix.python-version }}
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install ".[dev]"
    - name: Analysing the code with pylint
      run: |
        pylint eval_ac tests
